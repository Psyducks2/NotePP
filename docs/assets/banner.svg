<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B1F3D"/>
      <stop offset="100%" stop-color="#8E425C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- mini notebook+pen mark -->
  <g transform="translate(90,70) scale(0.16)">
    <rect x="272" y="228" width="480" height="600" rx="28" fill="#FDF5F6"/>
    <line x1="424" y1="316" x2="672" y2="316" stroke="#C07180" stroke-width="16" stroke-linecap="round"/>
    <line x1="424" y1="404" x2="672" y2="404" stroke="#C07180" stroke-width="16" stroke-linecap="round"/>
    <line x1="424" y1="492" x2="608" y2="492" stroke="#C07180" stroke-width="16" stroke-linecap="round"/>
    <g transform="rotate(45 700 620)">
      <rect x="660" y="360" width="80" height="420" rx="24" fill="#FBEEF1"/>
      <path d="M660 780 L700 860 L740 780 Z" fill="#742F4C"/>
    </g>
  </g>

  <text x="230" y="150" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="72" font-weight="600" fill="#FDF5F6">NotePP</text>
  <text x="232" y="195" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="26" fill="#F3ACAE">Bloco de notas rápido, offline e open source para Linux</text>
</svg>
