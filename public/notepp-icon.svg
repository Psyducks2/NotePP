<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3ACAE"/>
      <stop offset="100%" stop-color="#5B1F3D"/>
    </linearGradient>
    <linearGradient id="pen-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDEFF1"/>
      <stop offset="100%" stop-color="#DA8D95"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- notebook -->
  <rect x="272" y="228" width="480" height="600" rx="28" fill="#FDF5F6"/>
  <rect x="272" y="228" width="112" height="600" rx="28" fill="#5B1F3D" opacity="0.18"/>
  <line x1="424" y1="316" x2="672" y2="316" stroke="#C07180" stroke-width="16" stroke-linecap="round"/>
  <line x1="424" y1="404" x2="672" y2="404" stroke="#C07180" stroke-width="16" stroke-linecap="round"/>
  <line x1="424" y1="492" x2="608" y2="492" stroke="#C07180" stroke-width="16" stroke-linecap="round"/>

  <!-- pen, diagonal, crossing the notebook's bottom-right corner -->
  <g transform="rotate(45 700 620)">
    <rect x="660" y="360" width="80" height="420" rx="24" fill="url(#pen-metal)"/>
    <path d="M660 780 L700 860 L740 780 Z" fill="#742F4C"/>
    <rect x="660" y="360" width="80" height="64" rx="20" fill="#5B1F3D"/>
  </g>
</svg>
